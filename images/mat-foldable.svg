<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e4d6"/>
      <stop offset="1" stop-color="#e9d3bd"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c88a5a"/>
      <stop offset="1" stop-color="#a86a3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- folded mat (stacked rectangles) -->
  <rect x="80" y="110" width="240" height="44" rx="6" fill="url(#m1)"/>
  <rect x="80" y="80" width="240" height="44" rx="6" fill="#b8794c"/>
  <rect x="80" y="50" width="240" height="44" rx="6" fill="url(#m1)"/>
  <text x="200" y="200" font-family="serif" font-size="18" fill="#8f5a33" text-anchor="middle">Foldable</text>
</svg>
